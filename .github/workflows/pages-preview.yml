name: DirectFuel - acesso de testes

on:
  push:
    branches: [main, migration/supabase-foundation]
    paths: ['migration/pages/**', 'scripts/build-pages-preview.mjs', 'tests/pages-preview.test.mjs', 'supabase/functions/directfuel-preview/**', '.github/workflows/pages-preview.yml']
  pull_request:
    paths: ['migration/pages/**', 'scripts/build-pages-preview.mjs', 'tests/pages-preview.test.mjs', 'supabase/functions/directfuel-preview/**', '.github/workflows/pages-preview.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a página de acesso de testes no GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node scripts/build-pages-preview.mjs
      - run: node --test tests/pages-preview.test.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages-preview

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: directfuel-pages-preview
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar acesso de testes
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
